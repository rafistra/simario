      - orgUnitId
    StageCreateRequest:
      type: object
      properties:
        positionTypeId:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
      - positionTypeId
    StageOrderRequest:
      type: object
      properties:
        orderedIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - orderedIds
    StatusEnum:
      enum:
      - dry_run
      - applied
      type: string
      description: |-
        * `dry_run` - dry_run
        * `applied` - applied
    SupportInputRequest:
      type: object
      properties:
        positionId:
          type: string
          format: uuid
        domain:
          $ref: '#/components/schemas/DomainEnum'
      required:
      - domain
      - positionId
    TemplateRequest:
      type: object
      properties:
        positionTypeId:
          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        riskType:
          $ref: '#/components/schemas/RiskTypeEnum'
        description:
          type: string
        mitigations:
          type: array
          items:
            type: string
      required:
      - description
      - positionTypeId
      - riskType
      - stageId
    TemporaryPassword:
      type: object
      properties:
        temporaryPassword:
          type: string
      required:
      - temporaryPassword
    TextRequest:
      type: object
      properties:
        text:
          type: string
      required:
      - text
    Unregistered:
      type: object
      properties:
        nip:
          type: string
        fullName:
          type: string
      required:
      - fullName
      - nip
    UserInputRequest:
      type: object
      properties:
        nip:
          type: string
        fullName:
          type: string
        email:
          type: string
        orgUnitId:
          type: string
          format: uuid
          nullable: true
        isLocalAccount:
          type: boolean
      required:
      - email
      - fullName
      - isLocalAccount
      - nip
    Version:
      type: object
      properties:
        version:
          type: integer
      required:
      - version
    YearRequest:
      type: object
      properties:
        year:
          type: integer
          maximum: 2100
          minimum: 2000
      required:
      - year
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
