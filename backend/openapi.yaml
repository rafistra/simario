openapi: 3.0.3
info:
  title: SIMARIO API
  version: '1'
paths:
  /api/v1/auth/config:
    get:
      operationId: auth_config_retrieve
      description: Login page settings; also sets the CSRF cookie the SPA sends back.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
