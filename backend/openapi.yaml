openapi: 3.0.3
info:
  title: SIMARIO API
  version: '1'
paths:
  /api/v1/assessment-files/{id}:
    delete:
      operationId: assessment_files_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/assessment-queue:
    get:
      operationId: assessment_queue_retrieve
      description: 'GET: the Lini 3 queue (`QueueView`, FR-NIL-010).'
      parameters:
      - in: query
        name: quarterId
        schema:
          type: string
      tags:
      - assessments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/assessments/{id}/reopen:
    post:
      operationId: assessments_reopen_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{id}:
    patch:
      operationId: attachments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - board
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConfidentialRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConfidentialRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConfidentialRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{id}/download:
    get:
      operationId: attachments_download_retrieve
      description: |-
        302 to a 5-minute pre-signed URL under /storage (NFR-011); demo files without content
        answer with a sample file.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - board
      security:
      - cookieAuth: []
      responses:
        '302':
          description: No response body
  /api/v1/audit:
    get:
      operationId: audit_retrieve
      description: |-
        GET: the audit trail (FR-ADM-008), redacted per VIS-8 unless `original=1` (izin 24,
        logged).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: entityType
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: original
        schema:
          type: string
      - in: query
        name: position
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - insights
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/audit/facets:
    get:
      operationId: audit_facets_retrieve
      tags:
      - insights
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/config:
    get:
      operationId: auth_config_retrieve
      description: Login page settings; also sets the CSRF cookie the SPA sends back.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: |-
        Ends the session; after an SSO sign-in also answers the Keycloak end-session URL the
        browser goes to, so the next "Masuk dengan Akun Otorita IKN" asks again (R-10).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
          description: ''
  /api/v1/auth/password:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/collections/{name}:
    get:
      operationId: collections_retrieve
      description: 'GET /api/v1/collections/<name>: one prototype-shaped collection
        (signed-in users).'
      parameters:
      - in: path
        name: name
        schema:
          type: string
        required: true
      tags:
      - collections
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/comments/{id}:
    patch:
      operationId: comments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - board
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentEditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentEditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentEditRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/comments/{id}/withdraw:
    post:
      operationId: comments_withdraw_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - board
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/delegates/{id}/revoke:
    post:
      operationId: delegates_revoke_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/dev/clock:
    post:
      operationId: dev_clock_create
      tags:
      - dev
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClockRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClockRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockResult'
          description: ''
  /api/v1/dev/impersonate:
    post:
      operationId: dev_impersonate_create
      description: 'Same rules as the prototype''s authApi.signInSso: matched by NIP,
        never created.'
      tags:
      - dev
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NipRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
          description: ''
  /api/v1/dev/personas:
    get:
      operationId: dev_personas_retrieve
      description: Padanan describe() in the prototype's persona picker (LoginPage.tsx).
      tags:
      - dev
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Personas'
          description: ''
  /api/v1/dev/reset:
    post:
      operationId: dev_reset_create
      tags:
      - dev
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetResult'
          description: ''
  /api/v1/fiscal-years:
    post:
      operationId: fiscal_years_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/YearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/YearRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/fiscal-years/{year}:
    patch:
      operationId: fiscal_years_partial_update
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFiscalYearPatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFiscalYearPatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFiscalYearPatchRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/fiscal-years/{year}/archive:
    post:
      operationId: fiscal_years_archive_create
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/fiscal-years/{year}/archive-status:
    get:
      operationId: fiscal_years_archive_status_retrieve
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveStatus'
          description: ''
  /api/v1/home:
    get:
      operationId: home_retrieve
      description: 'GET: the home cards for the active holding (`HomeView`, FR-BRD-001
        … 010).'
      parameters:
      - in: query
        name: position
        schema:
          type: string
      tags:
      - home
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/imports:
    get:
      operationId: imports_list
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportHistory'
          description: ''
    post:
      operationId: imports_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
  /api/v1/imports/{id}/commit:
    post:
      operationId: imports_commit_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
          description: ''
  /api/v1/imports/kinds:
    get:
      operationId: imports_kinds_list
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  enum:
                  - jabatan
                  - pejabat
                  - penugasan
                  type: string
                  description: |-
                    * `jabatan` - jabatan
                    * `pejabat` - pejabat
                    * `penugasan` - penugasan
          description: ''
  /api/v1/imports/templates/{kind}:
    get:
      operationId: imports_templates_retrieve
      parameters:
      - in: path
        name: kind
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/active-position:
    put:
      operationId: me_active_position_update
      description: 'FR-AUT-009: the position the user last acted through.'
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivePositionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivePositionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivePositionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/positions:
    get:
      operationId: me_positions_retrieve
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPositions'
          description: ''
  /api/v1/metrics/{year}:
    get:
      operationId: metrics_retrieve
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - insights
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/metrics/{year}.csv:
    get:
      operationId: metrics_.csv_retrieve
      parameters:
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - insights
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: ''
  /api/v1/monitoring-assignments:
    post:
      operationId: monitoring_assignments_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentsInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignmentsInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignmentsInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/monitoring-assignments/{id}:
    delete:
      operationId: monitoring_assignments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/my-positions:
    get:
      operationId: my_positions_retrieve
      description: 'GET: Lini 1 positions in the viewer''s scope (`PositionListRow[]`,
        FR-BRD-011).'
      tags:
      - home
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/notifications:
    get:
      operationId: notifications_list
      description: The signed-in user's notifications, newest first (FR-NTF-013/014).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read:
    post:
      operationId: notifications_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/notifications/read-all:
    post:
      operationId: notifications_read_all_create
      tags:
      - notifications
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/occupancies:
    post:
      operationId: occupancies_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignResult'
          description: ''
  /api/v1/position-types/{id}:
    patch:
      operationId: position_types_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - master
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActiveRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/position-types/{id}/data-umum-forms:
    post:
      operationId: position_types_data_umum_forms_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - master
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataUmumFormRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DataUmumFormRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DataUmumFormRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          description: ''
  /api/v1/position-types/{id}/stage-order:
    put:
      operationId: position_types_stage_order_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - master
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StageOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StageOrderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/positions:
    post:
      operationId: positions_create
      tags:
      - master
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
          description: ''
  /api/v1/positions/{id}:
    put:
      operationId: positions_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - master
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PositionInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
          description: ''
  /api/v1/positions/{id}/assessments/{year}/{tw}:
    get:
      operationId: positions_assessments_retrieve
      description: |-
        GET: the assessment page of a position and quarter (`AssessmentView`, FR-NIL-001). With
        `?blind=1` and permission 24 the Superadmin sees unopened assessments; every such view is
        audit-logged (FR-NIL-012).
      parameters:
      - in: query
        name: blind
        schema:
          type: boolean
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: tw
        schema:
          type: integer
        required: true
      - in: path
        name: year
        schema:
          type: integer
        required: true
      tags:
      - assessments
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
