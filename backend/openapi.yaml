openapi: 3.0.3
info:
  title: SIMARIO API
  version: '1'
paths:
  /api/v1/auth/config:
    get:
      operationId: auth_config_retrieve
      description: Login page settings; also sets the CSRF cookie the SPA sends back.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
    AuthConfig:
      type: object
      properties:
        devTools:
          type: boolean
        oidcEnabled:
          type: boolean
      required:
      - devTools
      - oidcEnabled
    LoginRequest:
      type: object
      properties:
        nip:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - nip
      - password
    PasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 1
      required:
      - newPassword
    SignInResult:
      type: object
      properties:
        ok:
          type: boolean
        userId:
          type: string
          format: uuid
      required:
      - ok
      - userId
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
