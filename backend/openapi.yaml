components:
  schemas:
    ActivePositionRequest:
      type: object
      properties:
        positionId:
          type: string
          format: uuid
      required:
      - positionId
    ApiError:
      type: object
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
        message:
          type: string
        details:
          nullable: true
    AppointInputRequest:
      type: object
      properties:
        nip:
          type: string
        letterNo:
          type: string
        letterDate:
          type: string
          format: date
          nullable: true
        letterFile:
          type: string
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
      required:
      - letterDate
      - letterFile
      - letterNo
      - nip
    ArchiveStatus:
      type: object
      properties:
        year:
          type: integer
        status:
          type: string
        tw4Complete:
          type: boolean
        blockers:
          type: array
          items:
            type: string
        baseHardLimit:
          type: string
          format: date
        projected:
          type: string
          format: date
      required:
      - baseHardLimit
      - blockers
      - projected
      - status
      - tw4Complete
      - year
    AssignInputRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        decreeNo:
          type: string
        decreeDate:
          type: string
          format: date
          nullable: true
        decreeFile:
          type: string
          nullable: true
          minLength: 1
        startDate:
          type: string
          format: date
        isFiller:
          type: boolean
      required:
      - decreeDate
      - decreeNo
      - isFiller
      - positionId
      - startDate
      - userId
    AssignResult:
      type: object
      properties:
        occupancyId:
          type: string
          format: uuid
        promoted:
          type: integer
        fillerChanged:
          type: integer
      required:
      - fillerChanged
      - occupancyId
      - promoted
    AssignmentsInputRequest:
      type: object
      properties:
        targetPositionIds:
          type: array
          items:
            type: string
            format: uuid
        leadPositionId:
          type: string
          format: uuid
          nullable: true
        supports:
          type: array
          items:
            $ref: '#/components/schemas/SupportInputRequest'
        quarterFromId:
          type: string
          minLength: 1
        quarterToId:
          type: string
          minLength: 1
        decreeNo:
          type: string
      required:
      - decreeNo
      - leadPositionId
      - quarterFromId
      - quarterToId
      - targetPositionIds
    AuthConfig:
      type: object
      properties:
        devTools:
          type: boolean
        oidcEnabled:
          type: boolean
      required:
      - devTools
      - oidcEnabled
    BandDraftCreateRequest:
      type: object
      properties:
        effectiveFrom:
          type: string
          format: date
      required:
      - effectiveFrom
    BandInputRequest:
      type: object
      properties:
        lowerExclusive:
          type: number
          format: double
          nullable: true
        upperInclusive:
          type: number
          format: double
        predicate:
          $ref: '#/components/schemas/PredicateEnum'
        order:
          type: integer
        guidance:
          type: string
          default: ''
      required:
      - lowerExclusive
      - order
      - predicate
      - upperInclusive
    BandVersionRequest:
      type: object
      properties:
        effectiveFrom:
          type: string
          format: date
        bands:
          type: array
          items:
            $ref: '#/components/schemas/BandInputRequest'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OptionInputRequest'
      required:
      - bands
      - effectiveFrom
      - options
    CapacityEnum:
      enum:
      - pejabat
      - operator
      type: string
      description: |-
        * `pejabat` - pejabat
        * `operator` - operator
    ClockRequest:
      type: object
      properties:
        at:
