[project]
name = "simario-backend"
version = "0.1.0"
description = "SIMARIO backend (Django + DRF)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.116",
    "celery>=5.5,<5.6",
    "django>=5.2,<5.3",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.14.0",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.15",
    "djangorestframework-camel-case>=1.4.2",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['^.venv/']

[[tool.mypy.overrides]]
module = ["environ.*", "storages.*", "celery.*", "django_celery_beat.*", "djangorestframework_camel_case.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[[tool.mypy.overrides]]
# Celery's @shared_task is untyped.
module = ["simario.*.tasks"]
disallow_untyped_decorators = false
