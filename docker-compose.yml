name: simario

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: simario
      POSTGRES_USER: simario
      POSTGRES_PASSWORD: simario
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simario -d simario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
