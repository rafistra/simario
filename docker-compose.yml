name: simario

# Local development services (spec §4.11). Host processes read ../.env; containers get the
# same file plus the overrides in x-backend.environment (service names instead of localhost).

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
    DATABASE_URL: postgres://simario:simario@db:5432/simario
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://storage:9000
    CLAMAV_HOST: clamav
  # Mount source only: the image keeps its own /app/.venv, so --build picks up new dependencies.
  volumes:
    - ./backend/manage.py:/app/manage.py
    - ./backend/config:/app/config
    - ./backend/simario:/app/simario
    # seed_reference reads the Rapim templates and score options from docs/seed.
    - ./docs/seed:/docs/seed:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: simario
      POSTGRES_USER: simario
      POSTGRES_PASSWORD: simario
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simario -d simario"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-simario}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-simario-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      # 9000/9001 on the host are often taken; containers use storage:9000.
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py init_storage"
    restart: "no"

  api:
    <<: *backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # 8000 on the host is often taken.
      - "127.0.0.1:8100:8000"

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 5
    # beat has no healthcheck: it exposes no endpoint and runs no inspectable worker.

  beat:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      ["celery", "-A", "config", "beat", "-l", "info",
       "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

volumes:
  pgdata:
  rustfs-data:
  clamav-db:
