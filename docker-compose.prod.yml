name: simario-prod

# Staging and production (spec §4.11). One file for both; only .env.prod differs.
# Run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Local try-out: SIMARIO_ENV_FILE=.env.prod.local docker compose -f docker-compose.prod.yml \
#   --env-file .env.prod.local up -d --build
# Nothing but nginx publishes a port; RustFS, PostgreSQL and Redis stay on the internal network.

x-backend: &backend
  build: ./backend
  env_file:
    # SIMARIO_ENV_FILE=.env.prod.local to try the stack on this machine.
    - path: ${SIMARIO_ENV_FILE:-.env.prod}
      required: true
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-simario}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-simario}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://storage:9000
    CLAMAV_HOST: clamav
  volumes:
    # seed_reference reads the Rapim templates and score options (U-20).
    - ./docs/seed:/docs/seed:ro
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simario}
      POSTGRES_USER: ${POSTGRES_USER:-simario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  migrate:
    <<: *backend
    restart: "no"
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py init_storage &&
      python manage.py seed_reference && python manage.py collectstatic --noinput"

  api:
    <<: *backend
    command: ["gunicorn", "config.wsgi", "--bind", "0.0.0.0:8000", "--workers", "3",
              "--timeout", "120", "--access-logfile", "-"]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command:
      ["celery", "-A", "config", "beat", "-l", "info",
       "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_HIDE_UNMIGRATED: ${VITE_HIDE_UNMIGRATED:-true}
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  rustfs-data:
  clamav-db:
